[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "youtube-sieve"
version = "0.1.0"
description = "MCP server for focused YouTube playlist curation using the official YouTube Data API v3."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "tzdata==2026.6",  # time-zone data for platforms without a system database (Windows)
]

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_sieve"]

[dependency-groups]
dev = [
    "httpx2==2.16.2",  # FastAPI TestClient
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pyyaml==6.0.3",
    "ruff==0.17.6",
    "skills-ref==0.1.1",
]

[tool.ruff]
line-length = 100
src = [".", "src"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["tools", "youtube_sieve"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ['if __name__ == "__main__":']
